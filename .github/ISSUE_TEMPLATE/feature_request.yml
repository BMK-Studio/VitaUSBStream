name: Feature Request
description: Suggest a new feature or improvement for VitaUSBStream
title: "[Feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature or improvement for VitaUSBStream.

        Please describe your idea clearly and explain what it would improve.

  - type: textarea
    id: feature
    attributes:
      label: Feature description
      description: Describe the feature or improvement you would like to see.
      placeholder: Explain your idea clearly.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Explain what problem this feature would solve or what it would improve.
      placeholder: Tell me why this feature would be useful.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add any extra details, examples, screenshots, or references if needed.
      placeholder: Optional additional information.
    validations:
      required: false
